name: Terraform Plan

on:
  pull_request:
    branches: [main]

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_DIR: terraform/environments/prod
  AWS_REGION: us-east-1

jobs:
  plan:
    name: Terraform fmt, validate e plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # O bucket do state deriva do ID da conta, que muda a cada lab novo.
      - name: Terraform init
        run: ./scripts/tf-init.sh

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      # Plan precisa da VPC do infra-kubernetes (tags Project/Environment).
      - name: Check VPC
        id: vpc
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters Name=tag:Project,Values=tech-challenge Name=tag:Environment,Values=prod \
            --query 'Vpcs[0].VpcId' --output text 2>/dev/null || true)
          if [[ "$VPC_ID" == vpc-* ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "VPC tech-challenge/prod ausente — pulando plan (rode infra-kubernetes antes)."
          fi

      - name: Terraform plan
        if: steps.vpc.outputs.exists == 'true'
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -input=false
